[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# New revisions: YYYYMMDD_HHMMSS_<rev>_<slug> so ``versions/`` sorts in creation order.
# In .ini, ``%%`` becomes a single ``%`` for Alembic’s template (see alembic --help revision).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s
# No sqlalchemy.url here: alembic/env.py sets it from the environment via
# app.core.config.Settings (.env + env vars DATABASE_URL or POSTGRES_*).


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
